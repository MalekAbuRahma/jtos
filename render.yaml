# Render blueprint — STAGING ONLY (ADR 0005). Test data only (JTOS-115).
# In Render: New → Blueprint → pick this repo. Then set MAIN_ADMIN_* and run the setup script once.
services:
  - type: web
    name: jtos-api-staging
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: STAGE
        value: staging
      - key: NODE_VERSION
        value: "22"
      - key: EMAIL_DRIVER
        value: log
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jtos-db-staging
          property: connectionString
databases:
  - name: jtos-db-staging
    plan: basic-256mb
    postgresMajorVersion: "16"
